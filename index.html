<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>GA Coaching — Athlètes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05070d;
  --bg-soft:#090d17;
  --panel:#0d1320;
  --panel-2:#121a2a;
  --panel-3:#192238;
  --text:#f4f5f8;
  --dim:#8f99ad;
  --muted:#596379;
  --gold:#f5c542;
  --gold-2:#d99b18;
  --red:#8d1420;
  --red-bright:#d32938;
  --silver:#c8cedb;
  --bronze:#c1773c;
  --radius:18px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:var(--bg);
}

body{
  position:relative;
  min-height:100dvh;
  overflow-x:hidden;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -6%, rgba(141,20,32,.20), transparent 31rem),
    radial-gradient(circle at 100% 38%, rgba(116,10,25,.11), transparent 26rem),
    radial-gradient(circle at 0% 78%, rgba(116,10,25,.10), transparent 24rem),
    linear-gradient(180deg,#04060b 0%,#070a12 58%,#04060b 100%);
  -webkit-font-smoothing:antialiased;
}

body::before,
body::after{
  content:"";
  position:fixed;
  z-index:0;
  pointer-events:none;
  opacity:.18;
}

body::before{
  inset:-14rem -13rem auto auto;
  width:31rem;
  height:31rem;
  background:
    repeating-radial-gradient(circle at center,
      transparent 0 33px,
      rgba(175,25,39,.24) 34px 35px,
      transparent 36px 65px),
    repeating-conic-gradient(from 8deg,
      rgba(175,25,39,.26) 0 1deg,
      transparent 1deg 18deg);
  mask-image:radial-gradient(circle,#000 0 58%,transparent 75%);
  transform:rotate(11deg);
}

body::after{
  left:-12rem;
  bottom:-13rem;
  width:29rem;
  height:29rem;
  background:
    repeating-radial-gradient(circle at center,
      transparent 0 31px,
      rgba(175,25,39,.20) 32px 33px,
      transparent 34px 60px),
    repeating-conic-gradient(from 0deg,
      rgba(175,25,39,.22) 0 1deg,
      transparent 1deg 20deg);
  mask-image:radial-gradient(circle,#000 0 58%,transparent 76%);
  transform:rotate(-16deg);
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  position:relative;
  z-index:1;
  width:min(100%,460px);
  min-height:100dvh;
  margin:0 auto;
  padding:env(safe-area-inset-top) 0 calc(34px + env(safe-area-inset-bottom));
}

.hero{
  padding:22px 18px 8px;
  text-align:center;
}

.logo-shell{
  position:relative;
  width:186px;
  height:186px;
  margin:0 auto 15px;
  display:grid;
  place-items:center;
  border:1px solid rgba(211,41,56,.34);
  border-radius:28px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,0)),
    #202223;
  box-shadow:
    0 20px 55px rgba(0,0,0,.42),
    0 0 0 1px rgba(245,197,66,.05) inset,
    0 0 30px rgba(141,20,32,.13);
  overflow:hidden;
}

.logo-shell::before{
  content:"";
  position:absolute;
  inset:8px;
  border-radius:21px;
  border:1px solid rgba(245,197,66,.10);
  pointer-events:none;
}

.brand-logo{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
}

.brand-title{
  font-size:clamp(2rem,8vw,2.65rem);
  line-height:1;
  font-weight:900;
  letter-spacing:-.055em;
  text-transform:none;
  text-shadow:0 4px 22px rgba(0,0,0,.48);
}

.brand-title .ga{
  color:#f6f7fb;
}

.brand-title .coaching{
  color:var(--gold);
  text-shadow:
    0 0 18px rgba(245,197,66,.18),
    0 4px 22px rgba(0,0,0,.48);
}

.brand-mark{
  width:138px;
  height:15px;
  margin:14px auto 2px;
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--red-bright);
  opacity:.78;
}

.brand-mark::before,
.brand-mark::after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(90deg,transparent,currentColor);
}

.brand-mark::after{
  background:linear-gradient(90deg,currentColor,transparent);
}

.spider-mark{
  width:17px;
  height:17px;
  position:relative;
}

.spider-mark::before{
  content:"";
  position:absolute;
  inset:3px 5px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 -4px 0 -1px currentColor;
}

.spider-mark::after{
  content:"";
  position:absolute;
  inset:1px;
  background:
    linear-gradient(31deg,transparent 46%,currentColor 47% 53%,transparent 54%) left top/50% 50% no-repeat,
    linear-gradient(-31deg,transparent 46%,currentColor 47% 53%,transparent 54%) right top/50% 50% no-repeat,
    linear-gradient(-31deg,transparent 46%,currentColor 47% 53%,transparent 54%) left bottom/50% 50% no-repeat,
    linear-gradient(31deg,transparent 46%,currentColor 47% 53%,transparent 54%) right bottom/50% 50% no-repeat;
}

.controls{
  padding:13px 16px 12px;
}

.search-wrap{
  position:relative;
}

.search-icon{
  position:absolute;
  left:18px;
  top:50%;
  width:20px;
  height:20px;
  transform:translateY(-50%);
  color:#737d94;
  pointer-events:none;
}

.search{
  width:100%;
  height:58px;
  border:1px solid rgba(111,123,153,.23);
  border-radius:18px;
  outline:none;
  padding:0 50px 0 53px;
  color:var(--text);
  font-size:.87rem;
  font-weight:600;
  background:
    linear-gradient(135deg,rgba(255,255,255,.018),transparent),
    rgba(9,13,23,.92);
  box-shadow:
    0 14px 34px rgba(0,0,0,.24),
    0 1px 0 rgba(255,255,255,.02) inset;
  transition:border-color .18s,box-shadow .18s,background .18s;
}

.search::placeholder{
  color:#69738a;
}

.search:focus{
  border-color:rgba(245,197,66,.48);
  box-shadow:
    0 0 0 3px rgba(245,197,66,.07),
    0 14px 34px rgba(0,0,0,.24);
}

.clear-search{
  position:absolute;
  right:12px;
  top:50%;
  width:34px;
  height:34px;
  border:0;
  border-radius:11px;
  transform:translateY(-50%);
  display:none;
  align-items:center;
  justify-content:center;
  color:#8b94a7;
  background:rgba(255,255,255,.035);
}

.clear-search.visible{
  display:flex;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px 16px 14px;
  position:sticky;
  top:0;
  z-index:30;
  background:linear-gradient(180deg,rgba(5,7,13,.98),rgba(5,7,13,.91) 74%,transparent);
  backdrop-filter:blur(14px);
}

.tab{
  min-height:58px;
  border:1px solid rgba(113,124,151,.20);
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  color:#9ca5b8;
  font-size:.82rem;
  font-weight:800;
  background:
    linear-gradient(145deg,rgba(255,255,255,.022),transparent),
    rgba(13,19,32,.92);
  box-shadow:0 13px 27px rgba(0,0,0,.20);
  transition:transform .15s,border-color .18s,color .18s,background .18s,box-shadow .18s;
}

.tab:active{
  transform:scale(.98);
}

.tab.active{
  color:var(--gold);
  border-color:rgba(245,197,66,.78);
  background:
    linear-gradient(145deg,rgba(245,197,66,.14),rgba(245,197,66,.035)),
    #15140e;
  box-shadow:
    0 0 0 1px rgba(245,197,66,.17) inset,
    0 0 24px rgba(245,197,66,.12),
    0 14px 31px rgba(0,0,0,.28);
}

.tab-icon{
  width:19px;
  height:19px;
}

.status{
  width:fit-content;
  max-width:calc(100% - 32px);
  margin:0 auto 12px;
  padding:7px 12px;
  border:1px solid rgba(120,130,153,.12);
  border-radius:999px;
  color:#6f7a90;
  font-size:.58rem;
  font-weight:700;
  text-align:center;
  background:rgba(10,15,25,.74);
}

.status.error{
  color:#dc7780;
  border-color:rgba(211,41,56,.18);
}

.view{
  display:none;
}

.view.visible{
  display:block;
}

.list{
  padding:2px 16px 24px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.card,
.rank{
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  gap:13px;
  border:1px solid rgba(104,116,143,.15);
  border-radius:var(--radius);
  color:inherit;
  text-decoration:none;
  background:
    linear-gradient(112deg,rgba(255,255,255,.025),transparent 42%),
    rgba(12,18,30,.92);
  box-shadow:
    0 13px 29px rgba(0,0,0,.18),
    0 1px 0 rgba(255,255,255,.018) inset;
}

.card{
  min-height:76px;
  padding:13px 14px;
  transition:transform .15s,border-color .18s,background .18s;
}

.card::before,
.rank::before{
  content:"";
  position:absolute;
  left:0;
  top:16%;
  bottom:16%;
  width:2px;
  border-radius:0 2px 2px 0;
  background:linear-gradient(180deg,transparent,var(--red-bright),transparent);
  opacity:.64;
}

.card:active{
  transform:scale(.985);
}

.card:hover{
  border-color:rgba(211,41,56,.28);
}

.avatar{
  position:relative;
  overflow:hidden;
  width:48px;
  height:48px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(245,197,66,.09);
  border-radius:15px;
  font-size:1.45rem;
  background:
    radial-gradient(circle at 35% 28%,rgba(141,20,32,.18),transparent 55%),
    #151d2d;
}
.avatar span{position:relative;z-index:0}
.avatar img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.avatar.has-image{border-color:rgba(245,197,66,.22);box-shadow:0 5px 16px rgba(0,0,0,.22)}

.info{
  flex:1;
  min-width:0;
}

.name{
  overflow:hidden;
  color:#eff1f6;
  font-size:.86rem;
  font-weight:850;
  white-space:nowrap;
  text-overflow:ellipsis;
  letter-spacing:-.018em;
}

.sub{
  overflow:hidden;
  margin-top:5px;
  color:#69758d;
  font-size:.60rem;
  font-weight:650;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.arrow{
  width:30px;
  height:30px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:10px;
  color:#7e889d;
  background:rgba(255,255,255,.025);
}

.rank{
  min-height:70px;
  padding:12px 13px;
}

.rank.top1{
  border-color:rgba(245,197,66,.50);
  background:
    linear-gradient(105deg,rgba(245,197,66,.09),transparent 43%),
    rgba(16,18,25,.94);
}

.rank.top2{
  border-color:rgba(200,206,219,.26);
}

.rank.top3{
  border-color:rgba(193,119,60,.32);
}

.place{
  width:34px;
  height:34px;
  flex:none;
  display:grid;
  place-items:center;
  border:1px solid rgba(118,128,151,.15);
  border-radius:11px;
  color:#78839a;
  font-size:.70rem;
  font-weight:900;
  background:#172034;
}

.top1 .place{
  border-color:transparent;
  color:#080a0e;
  background:linear-gradient(135deg,#ffe279,#d99b18);
  box-shadow:0 0 19px rgba(245,197,66,.16);
}

.top2 .place{
  color:#0a0c11;
  background:linear-gradient(135deg,#eef1f7,#9ea8bb);
}

.top3 .place{
  color:#fff;
  background:linear-gradient(135deg,#dc9a61,#985227);
}

.score{
  flex:none;
  text-align:right;
}

.gl{
  color:var(--gold);
  font-size:.98rem;
  font-weight:900;
}

.total{
  margin-top:3px;
  color:#69758a;
  font-size:.56rem;
  font-weight:650;
}

.missing{
  opacity:.60;
}

.empty{
  padding:42px 18px;
  text-align:center;
  color:#6f798d;
  font-size:.75rem;
  line-height:1.55;
}

@media (max-width:360px){
  .logo-shell{
    width:164px;
    height:164px;
  }

  .brand-title{
    font-size:2rem;
  }

  .tab{
    min-height:54px;
    font-size:.76rem;
  }

  .sub{
    font-size:.56rem;
  }
}
</style>

</head>

function norm(s){
  return String(s||'')
    .replace(/\.html?$/i,'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .trim();
}
function compact(s){return norm(s).replace(/[\s_-]+/g,'')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function number(v){if(v==null)return null;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:null}
function extract(text,labels){const m=text.match(new RegExp('(?:'+labels+')\\s*[:=]?\\s*~?(-?\\d+(?:[.,]\\d+)?)','i'));return m?number(m[1]):null}
function extractLiftMax(text,label){
  const exact=text.match(new RegExp('\\b'+label+'\\s*:\\s*~?(-?\\d+(?:[.,]\\d+)?)\\s*(?:kg)?','i'));
  return exact?number(exact[1]):extract(text,label);
}
function extractProfileBodyWeight(text){
  for(const pattern of [
    /Poids utilisé\s*:\s*~?(\d+(?:[.,]\d+)?)/i,
    /Poids de référence\s*:\s*~?(\d+(?:[.,]\d+)?)/i,
    /Poids\s*:\s*~?(\d+(?:[.,]\d+)?)/i,
    /PDC\s*:\s*~?(\d+(?:[.,]\d+)?)/i
  ]){
    const m=text.match(pattern);
    if(m)return number(m[1]);
  }
  return null;
}
function displaySlug(slug){
  const normalized=norm(slug);
  if(DISPLAY_NAMES[normalized])return DISPLAY_NAMES[normalized];
  const value=String(slug||'').trim();
  return value ? value.charAt(0).toLocaleUpperCase('fr-FR')+value.slice(1) : '';
}
function gl(total,bw,sex){if(!(total>0&&bw>0))return 0;const c=sex==='F'?FEMALE:MALE;const coeff=Number((100/(c.A-c.B*Math.exp(-c.C*bw))).toFixed(6));return Number((total*coeff).toFixed(6))}
function extractStorageKey(scriptText){
  const patterns=[
    /const\s+SK\s*=\s*["']([^"']+)["']/,
    /const\s+LS_KEY\s*=\s*["']([^"']+)["']/,
    /const\s+STORAGE_KEY\s*=\s*["']([^"']+)["']/
  ];
  for(const pattern of patterns){const m=scriptText.match(pattern);if(m)return m[1]}
  return null;
}
function extractAthleteSlug(scriptText){
  const patterns=[
    /(?:window\.)?COACHING_ATHLETE\s*=\s*\{[\s\S]{0,2500}?\bslug\s*:\s*["'`]([^"'`]+)["'`]/i,
    /(?:window\.)?COACHING_ATHLETE\s*=\s*\{[\s\S]{0,2500}?["']slug["']\s*:\s*["'`]([^"'`]+)["'`]/i
  ];
  for(const pattern of patterns){const m=scriptText.match(pattern);if(m)return norm(m[1])}
  return '';
}
function extractProfileImage(scriptText){
  const patterns=[
    /(?:window\.)?COACHING_ATHLETE\s*=\s*\{[\s\S]{0,3500}?\bprofileImage\s*:\s*["'`]([^"'`]+)["'`]/i,
    /(?:window\.)?COACHING_ATHLETE\s*=\s*\{[\s\S]{0,3500}?["']profileImage["']\s*:\s*["'`]([^"'`]+)["'`]/i
  ];
  for(const pattern of patterns){const m=scriptText.match(pattern);if(m)return m[1].trim()}
  return '';
}
function extractConfiguredBodyWeight(scriptText){
  const patterns=[
    /(?:window\.)?COACHING_ATHLETE\s*=\s*\{[\s\S]{0,3500}?\bbodyWeight\s*:\s*(\d+(?:[.,]\d+)?)/i,
    /(?:window\.)?COACHING_ATHLETE\s*=\s*\{[\s\S]{0,3500}?["']bodyWeight["']\s*:\s*(\d+(?:[.,]\d+)?)/i
  ];
  for(const pattern of patterns){const m=scriptText.match(pattern);if(m)return number(m[1])}
  return null;
}
function assetHref(path){
  return String(path||'').split('/').map(encodeURIComponent).join('/');
}
function currentWeek(storageKey){
  if(!storageKey)return 1;
  try{
    const raw=localStorage.getItem(storageKey);
    if(!raw)return 1;
    const data=JSON.parse(raw);
    const index=Number.isInteger(data.W)?data.W:Number.isInteger(data.w)?data.w:0;
    return Math.max(1,index+1);
  }catch(e){return 1}
}
function weekLabel(a){return `Semaine ${currentWeek(a.storageKey)}`}
function pagePriority(page,slug){
  const stem=norm(page.file);
  let score=0;
  if(PREFERRED_PAGES[slug]===page.file)score+=1000000;
  if(page.profileImage)score+=20000;
  if(page.slug===slug)score+=10000;
  if(stem===slug)score+=5000;
  if(compact(stem)===compact(slug))score+=2500;
  if(!/(?:^|[\s_-])(?:bloc|block|programme|program|prog)?[\s_-]*\d+$/i.test(stem))score+=500;
  if(/^(?:index|wiki|journal|jeu|entrainement)/i.test(stem))score-=10000;
  score-=String(page.file||'').length/100;
  return score;
}
function choosePage(pages,slug){
  const canonical=CANONICAL_ATHLETES[slug];
  if(canonical){
    return pages.find(page=>page.file===canonical.file)||null;
  }
  const exact=pages.filter(page=>page.slug===slug);
  const candidates=exact.length?exact:pages.filter(page=>compact(page.file)===compact(slug));
  return candidates.sort((a,b)=>pagePriority(b,slug)-pagePriority(a,slug))[0]||null;
}

async function files(){
  try{
    const r=await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/?ref=${REPO.branch}`,{cache:'no-store'});
    if(!r.ok)throw new Error('GitHub '+r.status);
    const j=await r.json();
    return j
      .filter(x=>x.type==='file'&&/\.html?$/i.test(x.name)&&!/^index(?:[-_(].*)?\.html?$/i.test(x.name)&&!IGNORED_HTML_FILES.has(x.name))
      .map(x=>x.name);
  }catch(e){return FALLBACK}
}
async function read(file){
  const r=await fetch(encodeURIComponent(file),{cache:'no-store'});
  if(!r.ok)throw new Error(file);
  const html=await r.text();
  const doc=new DOMParser().parseFromString(html,'text/html');
  const pageText=(doc.body?.innerText||'').replace(/\s+/g,' ');
  const scriptText=Array.from(doc.scripts).map(s=>s.textContent||'').join('\n');
  const pageSlug=extractAthleteSlug(scriptText);
  const fallbackSlug=norm(file);
  const slug=pageSlug||fallbackSlug;
  const sq=extractLiftMax(pageText,'Squat');
  const bn=extractLiftMax(pageText,'Bench');
  const dl=extractLiftMax(pageText,'Deadlift');
  const htmlBw=extractProfileBodyWeight(pageText);
  const configuredBw=extractConfiguredBodyWeight(scriptText);
  const bw=configuredBw??(BODYWEIGHTS[slug]>0?BODYWEIGHTS[slug]:null)??htmlBw??null;
  const sex=SEX[slug]||'M';
  const canonicalByFile=Object.values(CANONICAL_ATHLETES)
    .find(profile=>profile.file===file);
  if(canonicalByFile){
    return {
      slug:canonicalByFile.slug,
      id:canonicalByFile.slug,
      file:canonicalByFile.file,
      name:canonicalByFile.name,
      emoji:canonicalByFile.emoji,
      profileImage:canonicalByFile.profileImage,
      sq:sq??canonicalByFile.sq,
      bn:bn??canonicalByFile.bn,
      dl:dl??canonicalByFile.dl,
      bw:bw??canonicalByFile.bodyWeight,
      sex:sex??canonicalByFile.sex,
      total:(sq??canonicalByFile.sq)+(bn??canonicalByFile.bn)+(dl??canonicalByFile.dl),
      storageKey:extractStorageKey(scriptText)
    };
  }
  return {
    slug,id:slug,file,
    name:displaySlug(slug),
    emoji:EMOJI[slug]||'🏋️',
    profileImage:PROFILE_IMAGES[slug]||extractProfileImage(scriptText),
    sq,bn,dl,bw,sex,
    total:(sq||0)+(bn||0)+(dl||0),
    storageKey:extractStorageKey(scriptText)
  };
}
function uniqueSlugs(rows){
  return [...new Set((rows||[])
    .map(row=>norm(typeof row==='string'?row:row?.athlete_slug))
    .filter(slug=>slug&&!EXCLUDED_ATHLETE_SLUGS.has(slug)))];
}
async function loadAppUserSlugs(){
  const config=window.COACHING_SUPABASE||{};
  if(!window.supabase||!config.url||!config.publishableKey){
    throw new Error('Configuration Supabase absente');
  }
  const client=window.supabase.createClient(config.url,config.publishableKey,{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},
    global:{headers:{'x-application-name':'ga-coaching-home-v171'}}
  });
  HOME_SUPABASE_CLIENT=client;

  const rpc=await client.rpc(HOME_ATHLETES_RPC);
  if(!rpc.error){
    const slugs=uniqueSlugs(rpc.data);
    if(slugs.length)return slugs;
  }

  const direct=await client
    .from('app_users')
    .select('athlete_slug')
    .eq('role','athlete')
    .not('athlete_slug','is',null);
  if(direct.error)throw direct.error;
  return uniqueSlugs(direct.data);
}

async function syncCurrentGlProfilesV171(list){
  const client=HOME_SUPABASE_CLIENT;
  if(!client||!Array.isArray(list)||!list.length)return 0;

  const sessionResult=await client.auth.getSession();
  if(!sessionResult?.data?.session)return 0;

  const profiles=list
    .filter(a=>!a.isProgramVariant&&a.slug&&a.storageKey&&a.sq>0&&a.bn>0&&a.dl>0&&a.bw>0)
    .map(a=>({
      athlete_slug:a.slug,
      program_key:a.storageKey,
      squat_max:a.sq,
      bench_max:a.bn,
      deadlift_max:a.dl,
      bodyweight:a.bw,
      sex:a.sex==='F'?'F':'M'
    }));

  if(!profiles.length)return 0;

  const {data,error}=await client.rpc(
    'sync_athlete_program_gl_batch_v171',
    {p_profiles:profiles}
  );

  if(error){
    if(!/function|schema cache|does not exist/i.test(error.message||'')){
      console.warn('Sync GL V171 accueil :',error.message);
    }
    return 0;
  }
  return Number(data)||0;
}

function render(list){
  const filtered=list.filter(a=>{
    const searchable=[a.name,a.displayName,a.programLabel,a.slug].map(norm).join(' ');
    return !SEARCH_QUERY||searchable.includes(SEARCH_QUERY);
  });

  const athleteHtml=filtered.map(a=>{
    const displayName=a.displayName||(
      !a.isProgramVariant&&BASE_PROGRAM_LABELS[a.slug]
        ? `${a.name} — ${BASE_PROGRAM_LABELS[a.slug]}`
        : a.name
    );
    const programPrefix=a.programLabel?`${a.programLabel} · `:'';
    const sub=a.file
      ? `${programPrefix}${weekLabel(a)} · SQ ${a.sq??'—'} · BN ${a.bn??'—'} · DL ${a.dl??'—'}${a.bw?' · '+a.bw+' kg':''}`
      : 'Page HTML introuvable';
    const image=a.profileImage
      ? `<img src="${esc(assetHref(a.profileImage))}?v=${a.slug==='marvin'?'20260809-v195-marvin':'20260806-v147-toms-separated'}" alt="Avatar ${esc(a.name)}" decoding="async" onerror="this.parentElement.classList.remove('has-image');this.remove()">`
      : '';
    const content=`<div class="avatar ${a.profileImage?'has-image':''}"><span>${esc(a.emoji)}</span>${image}</div><div class="info"><div class="name">${esc(displayName)}</div><div class="sub">${esc(sub)}</div></div><div class="arrow">${a.file?'›':'—'}</div>`;
    const pageHref=a.file
      ? `${encodeURIComponent(a.file)}${a.slug==='marvin'?'?v=20260809-v195-marvin-program':''}`
      : '';
    return a.file
      ? `<a class="card" href="${pageHref}" data-athlete-slug="${esc(a.slug)}" data-program-file="${esc(a.file)}">${content}</a>`
      : `<div class="card" data-athlete-slug="${esc(a.slug)}" style="opacity:.52;cursor:not-allowed">${content}</div>`;
  }).join('');
  document.getElementById('athleteList').innerHTML=athleteHtml||'<div class="empty">Aucun athlète ne correspond à cette recherche.</div>';

  // Une seule ligne par athlète dans le leaderboard : les blocs secondaires
  // restent visibles dans l'accueil, mais ne dupliquent pas le classement.
  const leaderboardAthletes=filtered.filter(a=>!a.isProgramVariant);
  const complete=leaderboardAthletes
    .map(a=>({...a,points:gl(a.total,a.bw,a.sex)}))
    .filter(a=>a.points>0)
    .sort((a,b)=>b.points-a.points);
  const incomplete=leaderboardAthletes.filter(a=>!((a.sq||0)+(a.bn||0)+(a.dl||0)>0&&a.bw>0));
  const rows=complete.map((a,i)=>`<div class="rank ${i===0?'top1':i===1?'top2':i===2?'top3':''}"><div class="place">${i+1}</div><div class="info"><div class="name">${esc(a.name)}</div><div class="sub">SQ ${a.sq} · BN ${a.bn} · DL ${a.dl} · ${a.bw} kg</div></div><div class="score"><div class="gl">${a.points.toFixed(1)}</div><div class="total">${a.total} total · GL</div></div></div>`);
  const miss=incomplete.map(a=>`<div class="rank missing"><div class="place">—</div><div class="info"><div class="name">${esc(a.name)}</div><div class="sub">${a.file?(a.bw?'Max manquant':'Poids de corps manquant'):'Page HTML introuvable'}</div></div><div class="score"><div class="gl">—</div><div class="total">Non classé</div></div></div>`);
  document.getElementById('rankList').innerHTML=[...rows,...miss].join('')||'<div class="empty">Aucune donnée trouvée.</div>';
}

async function boot(){
  const status=document.getElementById('status');
  status.textContent='Synchronisation des slugs app_users…';
  const fs=await files();
  const pageResults=await Promise.allSettled(fs.map(read));
  const pages=pageResults.filter(x=>x.status==='fulfilled').map(x=>x.value);

  let slugs=[];
  try{
    slugs=await loadAppUserSlugs();
    DATA_SOURCE='app_users';
  }catch(error){
    console.error('Lecture app_users impossible :',error);
    slugs=uniqueSlugs(pages.map(page=>page.slug));
    DATA_SOURCE='pages HTML (secours)';
  }

  slugs=uniqueSlugs([...PINNED_ATHLETE_SLUGS,...slugs]);

  const primaryAthletes=slugs.map(slug=>{
    const canonical=CANONICAL_ATHLETES[slug];
    const page=choosePage(pages,slug);

    if(canonical){
      return {
        slug:canonical.slug,
        id:canonical.slug,
        name:canonical.name,
        emoji:canonical.emoji,
        profileImage:canonical.profileImage,
        file:canonical.file,
        sq:page?.sq??canonical.sq,
        bn:page?.bn??canonical.bn,
        dl:page?.dl??canonical.dl,
        bw:page?.bw??canonical.bodyWeight,
        sex:page?.sex??canonical.sex,
        total:(page?.sq??canonical.sq)+(page?.bn??canonical.bn)+(page?.dl??canonical.dl),
        storageKey:page?.storageKey||null
      };
    }

    return page
      ? {...page,slug,id:slug,name:displaySlug(slug),emoji:EMOJI[slug]||page.emoji||'🏋️'}
      : {slug,id:slug,name:displaySlug(slug),emoji:EMOJI[slug]||'🏋️',profileImage:PROFILE_IMAGES[slug]||'',file:null,sq:null,bn:null,dl:null,bw:BODYWEIGHTS[slug]||null,sex:SEX[slug]||'M',total:0,storageKey:null};
  });

  const programVariants=PROGRAM_VARIANTS.map(variant=>{
    const page=pages.find(candidate=>candidate.file===variant.file);
    if(!page)return null;
    const slug=norm(variant.slug);
    return {
      ...page,
      slug,
      id:`${slug}:${variant.file}`,
      name:displaySlug(slug),
      displayName:variant.displayName||`${displaySlug(slug)} — ${variant.label}`,
      programLabel:variant.label,
      isProgramVariant:true,
      emoji:EMOJI[slug]||page.emoji||'🏋️',
      profileImage:PROFILE_IMAGES[slug]||page.profileImage||''
    };
  }).filter(Boolean);

  APP_LIST=[...primaryAthletes,...programVariants]
    .sort((a,b)=>(a.displayName||a.name).localeCompare(b.displayName||b.name,'fr'));

  await syncCurrentGlProfilesV171(primaryAthletes);
  render(APP_LIST);
  const missing=primaryAthletes.filter(a=>!a.file).map(a=>a.name);
  const missingVariants=PROGRAM_VARIANTS.filter(v=>!programVariants.some(p=>p.file===v.file)).map(v=>v.file);
  const duplicatesRemoved=Math.max(0,pages.filter(p=>slugs.includes(p.slug)).length-primaryAthletes.filter(a=>a.file).length-programVariants.length);
  status.textContent=`${primaryAthletes.length} athlètes depuis ${DATA_SOURCE} · ${duplicatesRemoved} doublon${duplicatesRemoved>1?'s':''} retiré${duplicatesRemoved>1?'s':''}${missing.length?' · pages manquantes : '+missing.join(', '):''}`;
  status.classList.toggle('error',DATA_SOURCE!=='app_users'||missing.length>0);
}

boot().catch(error=>{
  console.error(error);
  const status=document.getElementById('status');
  status.textContent='Erreur de synchronisation de la page d’accueil.';
  status.classList.add('error');
});

document.querySelectorAll('.tab').forEach(button=>{
  button.addEventListener('click',()=>show(button.dataset.view));
});

const athleteSearch=document.getElementById('athleteSearch');
const clearSearch=document.getElementById('clearSearch');
function applySearch(value){
  SEARCH_QUERY=norm(value);
  clearSearch.classList.toggle('visible',Boolean(value));
  if(APP_LIST.length)render(APP_LIST);
}
athleteSearch.addEventListener('input',event=>applySearch(event.target.value));
clearSearch.addEventListener('click',()=>{
  athleteSearch.value='';
  athleteSearch.focus();
  applySearch('');
});
window.addEventListener('pageshow',refreshHomeWeeks);
window.addEventListener('focus',refreshHomeWeeks);
window.addEventListener('storage',refreshHomeWeeks);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshHomeWeeks()});
</script></body></html>
