ner \xE0 te taper un petit peu trop fort dans les adducteurs, on va dire."},{t:"\xC7a, c'est la probl\xE9matique, et je peux t'en montrer\u2026 \xE7a, on en reparlera, mais je vais te montrer les cons\xE9quences de la premi\xE8re chose, le whip. Tu vois, sur un mec qui\u2026 l\xE0, tu vas le voir ici, la barre fait\u2026 tu vois le fait qu'elle bouge comme \xE7a. Lui, il s'entra\xEEne avec \xE7a parce qu'il squatte beaucoup plus que tout le monde, il est tr\xE8s large. Mais du coup, c'est la probl\xE9matique num\xE9ro une, et c'est peut-\xEAtre celle qui est la plus vite r\xE9glable."},{t:"La deuxi\xE8me chose qui me\u2026 il y a deux choses. La premi\xE8re : le pied nu sur du parquet. Bon, faut avoir les cojones, parce qu'il y a une possibilit\xE9 que tu glisses. Sur le walkout, donc ta sortie de barre, il y a une possibilit\xE9 que tu glisses, et \xE7a, c'est probl\xE9matique. Bon, tu vas me dire qu'avec ce poids-l\xE0, c'est un peu moins compliqu\xE9, un peu plus compliqu\xE9 de glisser, mais bon."},{t:"La deuxi\xE8me, c'est tes coudes : la distance de tes coudes par rapport \xE0 tes c\xF4tes. En fait, tes coudes, tu les mets vraiment beaucoup vers l'arri\xE8re, de la sorte, et du coup tu retiens pas mal la barre avec tes poignets et avec ton dos. Elle est un peu moins pos\xE9e, elle est un peu plus soutenue par \xE7a, tu vois. Et voil\xE0 ce que j'allais dire : en fait, tu vas cr\xE9er ta douleur, parce que l'acromion et la gl\xE8ne vont se remplir, du fait que ton poignet retient et pousse dans ton coude, ton coude renvoie dans ta gl\xE8ne, et du coup le biarticulaire de ta gl\xE9no-hum\xE9rale se prend une \xE9norme tension. Cette tension-l\xE0 fait des inflammations, voire m\xEAme des restrictions qui peuvent monter jusqu'au trap\xE8ze sup\xE9rieur, et tu peux parfois te sentir des raideurs au niveau du cou pour rien."},{t:"Donc moi, ce que je te conseille : d\xE9j\xE0, au d\xE9rack, quand tu vas sortir ta barre du rack, essaie d'avoir la t\xEAte un peu plus droite, de base. Essaie de regarder un peu plus droit, et \xE7a va juste naturellement abaisser tes \xE9paules. Et avant de d\xE9racker, essaie aussi d'avoir tes coudes le long du corps. Voil\xE0, plut\xF4t le long du corps. Essaie de redresser tes mains, quitte \xE0 avoir la prise un peu large au d\xE9but, \xE7a aura plus de sens. C'est un truc que j'ai beaucoup ressorti \xE0 Janel r\xE9cemment, parce qu'elle avait fait cette erreur-l\xE0."},{t:"Et du coup, il y a une\u2026 moi, tu vois, j'aime bien utiliser les outils des autres personnes : si c'est gratuit et si c'est pertinent, je vais les utiliser, tu vois.",aside:!0},{t:"Iban, qui est un mec du Pays basque, dit : \xAB arr\xEAte de lever tes coudes \xBB, et arr\xEAte de lever tes coudes en g\xE9n\xE9ral, parce que quand tu remontes, tu auras toujours tendance \xE0 faire remonter la barre sur ton dos, et donc \xE0 avoir la barre qui avance vers ta nuque. Et vu que tu vas la pousser naturellement, comme \xE7a, tu perds de la stabilit\xE9."},{t:"Et le principe num\xE9ro un de cette stabilit\xE9-l\xE0, c'est ce qu'on appelle la midfoot pressure : au squat, il faut pousser sur le milieu de ton pied. Au squat, le plus important, on va le revoir ici. L\xE0, tu vois, tu es d\xE9j\xE0 mieux, mais on va en reparler, il y a quand m\xEAme des points \xE0 changer. Mais au squat, le plus important, c'est ici. En fait, je t'expliquais pourquoi tu es tr\xE8s bas. Et quand tu vas repousser, tu vois, l\xE0 tes coudes bougent, et l\xE0 on perd de la stabilit\xE9. Mais ce qui est le plus d\xE9rangeant, regarde, tu vas le voir ici : regarde ton pied gauche. Tu vois ? Il bouge. Et tu ne veux pas garder une pression sur un endroit qui bouge."},{t:"Donc ton but dans un squat, c'est d'avoir deux choses. L\xE0, on parle juste de physique pure et dure : tu as une barre, et tu veux aligner la barre au milieu de ton pied pour pouvoir pousser le plus possible au milieu de ton pied. C'est un principe que tu peux retrouver sur le Discord : dans Force, tuto Force, j'ai laiss\xE9 des livres. Tu as Matt Perryman pour la p\xE9riodisation, et tu as la Squat Bible, sur la biom\xE9canique du squat. Ce sont ces principes-l\xE0, c'est en anglais, mais ce sont des principes de levier et des principes d'angles biom\xE9caniques du squat. Tu veux l'alignement entre la barre et le milieu de ton pied, et des flexions qui vont r\xE9pondre sym\xE9triquement \xE0 \xE7a."},{t:"Et du coup, dans l'id\xE9e, quand tu es en low bar ou quand tu es en high bar, le calcul est diff\xE9rent. Ce n'est que de la physique, tu fais de la biom\xE9canique, ce qu'on appelle calculer le torque. Tu vois, en low bar, tu auras peut-\xEAtre plus de flexion de hanche que sur un high bar, et \xE7a permettra de changer quand m\xEAme pas mal de choses pour pouvoir aligner ta barre. Donc ta position de barre doit s'aligner : c'est une solution directe pour aligner ta barre au milieu de ton pied, que tu sois low bar, high bar ou mid bar. Derri\xE8re, c'est ta fa\xE7on de squatter qui va \xEAtre le plus important."},{t:"L\xE0, dans la position de base, on voit une position o\xF9 la barre est quand m\xEAme bien positionn\xE9e. Les coudes, c'est toujours un petit peu \xE0 travailler, on peut peut-\xEAtre toujours les descendre un petit peu. Par contre, il y a un point qui me d\xE9range r\xE9ellement. Le point qui me d\xE9range le plus, c'est qu'on a un d\xE9salignement de la cha\xEEne. En gros, \xE7a veut dire que ton corps est comme \xE7a au d\xE9part, donc le poids est l\xE0. Disons que le poids, c'est le danger. M\xEAme pas forc\xE9ment, en fait : ce qui est d\xE9rangeant, c'est qu'il va percuter comme \xE7a, tu vois, et l\xE0 il va cr\xE9er un cisaillement. Alors que si, par exemple, je te donne un exemple, tu mettais ton corps avec l'alignement de tes jambes ici, et ton buste comme \xE7a derri\xE8re, tout le poids serait align\xE9 : tu le prendrais plus dans les jambes que dans le dos, par exemple. Parce que l\xE0, c'est la cha\xEEne sacro-iliaque : ce qui va prendre, c'est ce qu'on appelle l'ASI, l'articulation sacro-iliaque. Donc il se peut qu'apr\xE8s avoir pouss\xE9, et vu comment tu as boug\xE9 ton pied, tu fasses des cisaillements, donc de la lat\xE9ro\u2026",cut:!0}],Vc=[{t:"Alors, en termes de deadlift, on va regarder ta position. D\xE9j\xE0, une position avec une stance assez normale, alignement \xE9paules et pieds, c'est souvent la chose normale. On a une position tr\xE8s verticale, ce qui est une bonne chose. Maintenant, on voit une erreur qui est principale : c'est l'incompr\xE9hension du wedge. Regarde, on va le voir. \xC7a se verra encore plus de profil."},{t:"Ah, j'ai une vid\xE9o de profil, \xE7a va, c'est encore plus simple. Ah non, merde, tu reviens de face. \xC7a va quand m\xEAme se voir.",aside:!0},{t:"L\xE0, c'est d\xE9j\xE0 un peu mieux. Mais tu vois, il y a toujours ce principe-l\xE0, regarde bien. Tu tires, et l\xE0 tes fesses vont monter. Quand tes fesses montent, \xE7a fait un principe de pendule, tu vas avoir un peu l'id\xE9e : tes fesses sont l\xE0, elles vont monter, et si elles montent, tes \xE9paules vont aller vers l'avant. Et \xE7a va se voir : bam, les \xE9paules vont vers l'avant. Si les \xE9paules vont vers l'avant, tu es comme \xE7a : ta barre est ici, tes \xE9paules sont l\xE0, et \xE7a cr\xE9e l'arrondi thoracique, mais aussi ici. Du coup, l\xE0 tu perds ta proximit\xE9 avec ta barre, et tu vas tirer beaucoup de force dans cette position. Et l\xE0, tu vas retravailler. L\xE0, il y a une pouss\xE9e qui est int\xE9ressante, et l\xE0 tu es oblig\xE9 d'appuyer pour pouvoir\u2026 Et \xE7a, \xE7a vient de ta position de d\xE9part."},{t:"Alors, moi, je vais t'expliquer la technique principale. Elle va \xEAtre tr\xE8s simple. Il y a deux choses \xE0 comprendre : le wedging, et comment positionner ses hanches. La premi\xE8re chose qui est int\xE9ressante, c'est que dans ta position, quand tu es l\xE0, essaie non pas de t'asseoir, mais plut\xF4t de garder les hanches tr\xE8s hautes, un peu plus hautes. Et quand tu pousses dans le sol, essaie de pousser dans le sol en voulant reculer les genoux. Tu veux essayer d'aller chercher \xE0 reculer les genoux. Exactement. L\xE0, il faudrait que ton bassin soit plus haut, ici. Et quand tu veux commencer \xE0 pousser ta barre, au lieu d'aller pousser dans le sol, essaie de reculer les genoux."},{t:"En fait, \xE7a, c'est ce que j'appelle une cue. Une cue, c'est quelque chose de tr\xE8s vulgaris\xE9 que je te donne, une petite astuce tr\xE8s vulgaris\xE9e : \xAB recule les genoux \xBB. Et reculer les genoux, \xE7a veut dire quoi ? En reculant les genoux, tu vas ramener ton bassin vers la barre. Parce que, si tu l'essaies, tu peux l'essayer sur ta chaise de bureau : si tu recules les genoux de ta chaise de bureau, tu vas ramener en m\xEAme temps tes hanches. M\xEAme debout : tu plies tes genoux debout, et quand tu les recules, \xE7a ram\xE8ne ton bassin. Tu vois."},{t:"\xC7a, c'est la premi\xE8re chose, c'est l'intention que tu vas avoir : reculer les genoux. Et ensuite, on aura une deuxi\xE8me intention, qui va \xEAtre la foot pressure, donc pousser dans le sol au bon moment. Donc si tu pousses sur l'avant de ton pied \xE0 la fin, quand tu es sur cette partie-l\xE0, tu vois, tu as d\xE9j\xE0 les hanches tr\xE8s hautes, parce qu'elles sont mont\xE9es, et tu es en train de soulever ta barre tout en haut. Et quand tu es ici, tu n'as plus de quoi wedger, tu n'as plus de quoi ramener tes hanches. En fait, \xE0 ce moment-l\xE0, quand tu arrives en dessous de tes genoux, il faut pousser dans l'avant de ton pied, reculer les genoux et ramener ton bassin."},{t:"Je vais te montrer \xE0 quoi \xE7a ressemble sur des vitesses un peu plus\u2026 Yannick le fait tr\xE8s bien, par exemple, mais je lui mets beaucoup de RDL pour travailler \xE7a. Il essaie de faire reculer ses hanches, tu vois, comme \xE7a, pour avoir la bonne position de hanches. Et Yannick, sur son terre, \xE7a ressemble \xE0 \xE7a. Il est l\xE0. L\xE0. Et quand il arrive, il recule les genoux, et l\xE0 il appuie fort sur l'avant de son pied pour pouvoir reculer encore plus, et \xE7a fait bam. Tu vois ? Quand il lock : bam. Bam. Exactement. En fait, c'est comme si tu poussais dans le sol comme sur un squat, mais avec les jambes en extension."}];var Nt=Ae($t());var N=Ae(Wt()),x={teal:"#007d82",deep:"#004042",red:"#b3261e",green:"#388f30",copper:"#c38961",ink:"#1f3537",muted:"#5d7476",line:"#cfdcdc",paper:"#f4f8f8"};function Gc(){return(0,N.jsxs)("svg",{viewBox:"0 0 420 200",className:"w-full",role:"img","aria-label":"Barre qui fouette avec des bumpers",children:[(0,N.jsx)("line",{x1:"20",y1:"170",x2:"400",y2:"170",stroke:x.line,strokeWidth:"2"}),(0,N.jsx)("path",{stroke:x.ink,strokeWidth:"5",fill:"none",strokeLinecap:"round",children:(0,N.jsx)("animate",{attributeName:"d",dur:"0.9s",repeatCount:"indefinite",values:"M40 90 Q210 80 380 90; M40 70 Q210 115 380 70; M40 110 Q210 70 380 110; M40 90 Q210 80 380 90"})}),[40,380].map((e,t)=>(0,N.jsxs)("g",{children:[(0,N.jsx)("animateTransform",{attributeName:"transform",type:"translate",dur:"0.9s",repeatCount:"indefinite",values:"0 0; 0 -20; 0 20; 0 0"}),(0,N.jsx)("rect",{x:e-14,y:"35",width:"28",height:"110",rx:"5",fill:x.teal}),(0,N.jsx)("rect",{x:e+(t?-24:14)-0,y:"50",width:"10",height:"80",rx:"3",fill:x.deep})]},t)),(0,N.jsx)("circle",{cx:"210",cy:"86",r:"16",fill:"none",stroke:x.red,strokeWidth:"3",strokeDasharray:"4 4"}),(0,N.jsx)("text",{x:"210",y:"190",textAnchor:"middle",fontSize:"14",fill:x.red,fontWeight:"700",children:"ton dos encaisse le rebond \u2192 adducteurs / gracile"})]})}i(Gc,"WhipBar");function Zc(){return(0,N.jsxs)("div",{className:"w-full",children:[(0,N.jsx)("div",{className:"flex flex-wrap items-center justify-center gap-1.5",children:["Poignet retient","Coude pousse","Gl\xE8ne / acromion","Trap\xE8ze sup \xB7 cou"].map((t,n)=>(0,N.jsxs)("div",{className:"flex items-center gap-1.5",children:[(0,N.jsx)("span",{className:"rounded-xl border-2 px-2.5 p
