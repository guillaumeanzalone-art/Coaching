<style>
:root {
  --bg:#090a0d;--surface:#15181d;--surface2:#20252d;--surface3:#2c333d;
  --text:#f8fafc;--dim:#c1c8d0;--muted:#87919c;--accent:#ff9d2f;
  --accent2:#ffd166;--green:#58d68d;--sq:#ff665d;--bn:#6e8cff;--dl:#c36af1;
  --ac:#ff9d2f;--radius:15px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,-apple-system,sans-serif;background:
radial-gradient(circle at 10% 0%,rgba(255,157,47,.17),transparent 30%),
radial-gradient(circle at 90% 10%,rgba(110,140,255,.10),transparent 28%),
var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:auto;padding-bottom:90px}
.header{position:sticky;top:0;z-index:100;background:rgba(9,10,13,.96);backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,157,47,.18);padding:13px 16px 12px}
.header-top{display:flex;align-items:center;gap:10px}
.back{width:38px;height:38px;border:0;border-radius:11px;background:var(--surface2);color:var(--accent);
display:grid;place-items:center;text-decoration:none;font-size:20px}
.avatar{width:42px;height:42px;border-radius:13px;overflow:hidden;background:var(--surface2);border:1px solid rgba(255,157,47,.45)}
.avatar img{width:100%;height:100%;object-fit:cover}
.title{flex:1} .title h1{font-size:1.02rem;font-weight:900} .title small{color:var(--muted);font-size:.65rem}
.block-nav{display:flex;gap:6px;margin-top:10px}
.block-nav a{flex:1;text-align:center;text-decoration:none;padding:8px;border-radius:9px;background:var(--surface);
color:var(--dim);font-size:.69rem;font-weight:800;border:1px solid transparent}
.block-nav a.active{color:#111;background:var(--accent);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 16px 8px}
.stat{background:var(--surface);padding:9px 4px;border-radius:11px;text-align:center}
.stat b{display:block;font-size:.9rem} .stat span{font-size:.56rem;color:var(--muted);font-weight:700;text-transform:uppercase}
.week-selector{display:flex;gap:6px;padding:4px 16px 10px}
.week-btn{flex:1;height:38px;border:0;border-radius:10px;background:var(--surface);color:var(--dim);font-weight:800}
.week-btn.active{background:var(--accent);color:#111}
.day-tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.day-tabs::-webkit-scrollbar{display:none}
.day-tab{flex:0 0 auto;min-width:72px;border:1px solid transparent;border-radius:11px;background:var(--surface);
color:var(--dim);padding:9px 10px;font-size:.68rem;font-weight:800}
.day-tab.active{background:var(--surface3);color:white;border-color:rgba(255,157,47,.45)}
.session-bar{margin:0 16px 12px;background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:9px}
.chrono{font-weight:900;font-size:.76rem;min-width:45px;cursor:pointer}
.bar{height:5px;background:var(--surface3);border-radius:4px;overflow:hidden;flex:1}
.bar-fill{height:100%;width:0;background:var(--accent);transition:.2s}
.pct{font-size:.66rem;font-weight:900;color:var(--accent);width:34px;text-align:right}
.content{padding:0 16px}
.exercise{background:var(--surface);border-radius:15px;padding:14px;margin-bottom:10px}
.ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.ex-name{font-size:.86rem;font-weight:900;line-height:1.25}
.badge{font-size:.57rem;font-weight:900;padding:4px 7px;border-radius:999px;text-transform:uppercase}
.badge-sq{background:rgba(255,102,93,.13);color:var(--sq)}
.badge-bn{background:rgba(110,140,255,.13);color:var(--bn)}
.badge-dl{background:rgba(195,106,241,.13);color:var(--dl)}
.badge-ac{background:rgba(255,157,47,.13);color:var(--ac)}
.meta{font-size:.64rem;color:var(--muted);font-weight:700;margin-bottom:8px}
.set-row{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:10px;padding:8px;margin-top:5px}
.set-row.completed{background:rgba(88,214,141,.12);outline:1px solid rgba(88,214,141,.18)}
.set-num{width:23px;height:23px;display:grid;place-items:center;border-radius:6px;background:var(--surface3);font-size:.62rem;font-weight:900}
.set-info{flex:1;min-width:70px;font-size:.68rem;color:var(--dim);line-height:1.35}
.set-info strong{color:white}
.load-select,.rpe-select,.load-input{height:30px;border-radius:7px;border:1px solid rgba(255,255,255,.07);
background:var(--surface3);color:white;font:700 .66rem Inter;text-align:center;outline:none}
.load-select,.load-input{width:67px} .rpe-select{width:49px}
.load-input{display:none} .load-input.visible{display:block}
.edit{width:25px;height:25px;border:0;border-radius:6px;background:var(--surface3);color:var(--muted)}
.check{width:31px;height:31px;border-radius:8px;border:2px solid rgba(255,255,255,.12);background:transparent}
.check.checked{background:var(--green);border-color:var(--green)}
.check.checked:after{content:"✓";font-size:18px;font-weight:900;color:#08130d}
.notes{margin:4px 16px 0;padding:12px 14px;background:rgba(255,157,47,.08);border:1px solid rgba(255,157,47,.17);border-radius:12px;
font-size:.67rem;color:var(--dim);line-height:1.5}
.notes b{color:var(--accent2)}
.end-btn{display:none;width:calc(100% - 32px);margin:16px;padding:13px;border:1px solid var(--accent);
border-radius:12px;background:rgba(255,157,47,.12);color:var(--accent);font-weight:900}
.end-btn.visible{display:block}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(21,24,29,.97);
border-top:1px solid rgba(255,157,47,.18);padding:9px 18px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:150}
.bottom button{border:0;background:none;color:var(--accent);font:800 .72rem Inter;padding:6px 20px}
.overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(5,6,8,.96);align-items:center;justify-content:center;padding:24px}
.overlay.visible{display:flex}
.modal{width:min(320px,100%);background:var(--surface);border-radius:18px;padding:22px;text-align:center}
.modal h2{color:var(--accent);margin-bottom:14px}
.big{font-size:2.2rem;font-weight:900;color:var(--green)}
.modal button{margin-top:14px;border:0;border-radius:10px;background:var(--accent);padding:10px 20px;font-weight:900}
</style>

let W=0,D=0,sets={},loads={},rpes={},freeMode={},chronoRunning=false,chronoStart=0,chronoElapsed=0,chronoInt=null;

function h(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function stateKey(w,d,ei,bi,si){return `${w}_${d}_${ei}_${bi}_${si}`}
function parseRange(ld){
  if(!ld)return null;
  const m=String(ld).match(/([\d.]+)\s*-\s*([\d.]+)/);
  if(m)return {lo:+m[1],hi:+m[2]};
  const v=parseFloat(ld); return Number.isFinite(v)?{lo:v,hi:v}:null;
}
function loadOpts(ld){
  const r=parseRange(ld); if(!r)return [];
  let a=[]; let lo=Math.floor((r.lo-10)*2)/2, hi=Math.ceil((r.hi+10)*2)/2;
  for(let v=lo;v<=hi+.001;v+=2.5)a.push(+v.toFixed(1));
  return a;
}
function save(){
  localStorage.setItem(SK,JSON.stringify({W,D,sets,loads,rpes,freeMode,chronoRunning,chronoStart,chronoElapsed}));
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(SK)||"{}");
    W=Number(d.W)||0;D=Number(d.D)||0;sets=d.sets||{};loads=d.loads||{};rpes=d.rpes||{};
    freeMode=d.freeMode||{};chronoRunning=!!d.chronoRunning;chronoStart=Number(d.chronoStart)||0;chronoElapsed=Number(d.chronoElapsed)||0;
  }catch(_e){}
}
function renderWeeks(){
  weekSelector.innerHTML=P.weeks.map((w,i)=>`<button class="week-btn ${i===W?'active':''}" onclick="setWeek(${i})">${w.label}</button>`).join("");
}
function renderDays(){
  const days=P.weeks[W].days;
  if(D>=days.length)D=0;
  dayTabs.innerHTML=days.map((d,i)=>`<button class="day-tab ${i===D?'active':''}" onclick="setDay(${i})">${d.emoji}<br>${h(d.name)}</button>`).join("");
}
function setWeek(i){W=i;D=0;save();renderAll()}
function setDay(i){D=i;save();renderAll()}
function toggleSet(k){
  sets[k]=!sets[k];save();renderExercises();
}
function setLoad(k,v){loads[k]=v;save()}
function setRpe(k,v){rpes[k]=v;save()}
function toggleFree(k){
  freeMode[k]=!freeMode[k];save();renderExercises();
}
function totalSets(){
  return P.weeks[W].days[D].exercises.reduce((n,e)=>n+e.blocks.reduce((s,b)=>s+(Number(b.s)||0),0),0);
}
function doneSets(){
  let n=0;
  P.weeks[W].days[D].exercises.forEach((e,ei)=>e.blocks.forEach((b,bi)=>{for(let si=0;si<b.s;si++)if(sets[stateKey(W,D,ei,bi,si)])n++}));
  return n;
}
function renderExercises(){
  const exs=P.weeks[W].days[D].exercises;
  content.innerHTML=exs.map((e,ei)=>{
    const badge=e.l==='sq'?'Squat':e.l==='bn'?'Bench':e.l==='dl'?'Deadlift':'Accessoire';
    let rows='';
    e.blocks.forEach((b,bi)=>{
      for(let si=0;si<b.s;si++){
        const k=stateKey(W,D,ei,bi,si), done=!!sets[k], lk=k+'_ld', rk=k+'_rpe';
        const opts=loadOpts(b.ld);
        const selected=loads[lk]??'';
        const selectHtml=opts.length
          ? `<select class="load-select" onchange="setLoad('${lk}',this.value)"><option value="">kg</option>${opts.map(v=>`<option value="${v}" ${String(selected)===String(v)?'selected':''}>${v}</option>`).join('')}</select>`
          : `<input class="load-input visible" inputmode="decimal" placeholder="${b.ld?'kg':'charge'}" value="${h(selected)}" onchange="setLoad('${lk}',this.value)">`;

          <div class="set-num">${si+1}</div>
          <div class="set-info"><strong>${h(b.r)} rep${String(b.r)==='1'?'':'s'}</strong>${b.pct!=null?` · ${b.pct}%`:''}${b.ld?`<br>${h(b.ld)} kg`:''}</div>
          ${selectHtml}
          <select class="rpe-select" onchange="setRpe('${rk}',this.value)">
            <option value="">RPE</option>${[5,5.5,6,6.5,7,7.5,8,8.5,9,9.5,10].map(v=>`<option value="${v}" ${String(rpes[rk]??'')===String(v)?'selected':''}>${v}</option>`).join('')}

        </div>`;

function updateProgress(){

}
function formatTime(ms){
  const s=Math.floor(ms/1000),m=Math.floor(s/60);
  return `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}
function updateChrono(){
  let ms=chronoElapsed+(chronoRunning?(Date.now()-chronoStart):0);
  chrono.textContent=formatTime(ms);
}
function toggleChrono(){
  if(chronoRunning){chronoElapsed+=Date.now()-chronoStart;chronoRunning=false;clearInterval(chronoInt)}
  else{chronoRunning=true;chronoStart=Date.now();chronoInt=setInterval(updateChrono,1000)}
  save();updateChrono();
}
function endSession(){
  if(chronoRunning){chronoElapsed+=Date.now()-chronoStart;chronoRunning=false;clearInterval(chronoInt);save()}

}

chrono.addEventListener('click',toggleChrono);
load();renderAll();if(chronoRunning)chronoInt=setInterval(updateChrono,1000);
