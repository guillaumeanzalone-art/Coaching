name: Play Closed Build

on:
  push:
    branches:
      - play-closed-20261006
    paths-ignore:
      - .github/play-closed-status.json

permissions:
  contents: write

env:
  APP_DIR: v2
  APP_ID: com.gacoaching.app
  RELEASE_VERSION: "1.5.0"
  ANDROID_VERSION_CODE: "26100601"

jobs:
  android-build:
    name: Android closed-test AAB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: play-closed-20261006

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run project tests
        run: |
          npm run test:cloud
          npm run test:importer
          npm run test:mobility

      - name: Prepare store version
        run: node scripts/set-store-version.mjs "$RELEASE_VERSION" "$ANDROID_VERSION_CODE" "20261006.1"

      - name: Build web and sync Android
        run: npm run android:sync

      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Keep AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: ga-coaching-play-closed-unsigned-${{ env.RELEASE_VERSION }}
          path: v2/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Record build status
        if: always()
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          cat > .github/play-closed-status.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "job_status": "${{ job.status }}",
            "version_name": "${RELEASE_VERSION}",
            "version_code": "${ANDROID_VERSION_CODE}",
            "track": "alpha",
            "phase": "unsigned-build",
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          git config user.name "ga-coaching-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/play-closed-status.json
          git commit -m "Record Play closed build status [skip ci]" || exit 0
          git push origin HEAD:play-closed-20261006
