name: Materialize Gibertini Theme

on:
  push:
    branches:
      - v2-refactor
    paths:
      - ".github/workflows/materialize-gibertini-theme.yml"

permissions:
  contents: write

jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v2-refactor

      - name: Build WebP from temporary chunks
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/gibertini-00.b64 \
              .github/tmp/gibertini-01.b64 \
              .github/tmp/gibertini-02.b64 \
              .github/tmp/gibertini-03.b64 \
            | base64 -d > v2/public/gibertini-atrew-mobile.webp
          test -s v2/public/gibertini-atrew-mobile.webp

      - name: Commit mobile theme asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ga-coaching-theme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add v2/public/gibertini-atrew-mobile.webp
          git commit -m "Add ATREW mobile theme for Tom Gibertini"
          git push origin HEAD:v2-refactor
