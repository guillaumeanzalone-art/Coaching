name: Validated Sets Green CI

on:
  push:
    branches:
      - validated-green-ci-20261008

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run build
