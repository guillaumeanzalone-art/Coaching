name: iOS TestFlight from Windows

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branche/commit à builder"
        required: true
        default: "v2-refactor"
        type: string
      marketing_version:
        description: "Version iOS (ex: 1.3)"
        required: true
        default: "1.3"
        type: string
      upload_to_testflight:
        description: "Uploader le .ipa vers App Store Connect/TestFlight"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build + TestFlight
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Validate Apple secrets
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          missing=0

          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret GitHub manquant: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install web dependencies and sync Capacitor iOS
        working-directory: v2
        run: |
          npm ci
          npm run ios:sync

      - name: Prepare App Store Connect API key
        id: api_key
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          KEY_DIR="$RUNNER_TEMP/appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate unique build number
        id: meta
        shell: bash
        run: |
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version: ${{ inputs.marketing_version }}"
          echo "Build: $BUILD_NUMBER"

      - name: Archive signed iOS app
        working-directory: v2
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ${{ steps.api_key.outputs.key_path }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
        run: |
          set -euo pipefail

          mkdir -p build

          xcodebuild             -project ios/App/App.xcodeproj             -scheme App             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$PWD/build/App.xcarchive"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGN_STYLE=Automatic             MARKETING_VERSION="$MARKETING_VERSION"             CURRENT_PROJECT_VERSION="$BUILD_NUMBER"             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "$ASC_KEY_ID"             -authenticationKeyIssuerID "$ASC_ISSUER_ID"             archive

      - name: Create export options
        working-directory: v2
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        working-directory: v2
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_PATH: ${{ steps.api_key.outputs.key_path }}
        run: |
          set -euo pipefail

          rm -rf build/export
          mkdir -p build/export

          xcodebuild             -exportArchive             -archivePath "$PWD/build/App.xcarchive"             -exportPath "$PWD/build/export"             -exportOptionsPlist "$PWD/build/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "$ASC_KEY_ID"             -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          IPA_PATH="$(find "$PWD/build/export" -maxdepth 2 -name '*.ipa' -print -quit)"

          if [ -z "$IPA_PATH" ]; then
            echo "::error::Aucun fichier .ipa produit."
            exit 1
          fi

          echo "IPA: $IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.marketing_version }}-${{ steps.meta.outputs.build_number }}
          path: v2/build/export/*.ipa
          if-no-files-found: error
          retention-days: 3

      - name: Upload to App Store Connect / TestFlight
        if: ${{ inputs.upload_to_testflight }}
        working-directory: v2
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          IPA_PATH="$(find "$PWD/build/export" -maxdepth 2 -name '*.ipa' -print -quit)"

          xcrun altool             --upload-app             --type ios             --file "$IPA_PATH"             --apiKey "$ASC_KEY_ID"             --apiIssuer "$ASC_ISSUER_ID"             --output-format json

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## iOS CI"
            echo ""
            echo "- Source: \`${{ inputs.source_ref }}\`"
            echo "- Version: \`${{ inputs.marketing_version }}\`"
            echo "- Build: \`${{ steps.meta.outputs.build_number }}\`"
            echo "- Upload TestFlight: \`${{ inputs.upload_to_testflight }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
