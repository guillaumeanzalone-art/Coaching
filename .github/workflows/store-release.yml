name: Store Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branche / tag à publier"
        required: true
        default: "v2-refactor"
        type: string
      version:
        description: "Version publique (ex: 1.2.0)"
        required: true
        default: "1.2.0"
        type: string
      platform:
        description: "Plateforme à construire"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - android
          - ios
      publish:
        description: "Publier après le build (sinon artefacts seulement)"
        required: true
        default: false
        type: boolean
      android_track:
        description: "Piste Google Play si publication Android"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

concurrency:
  group: store-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: v2
  APP_ID: com.gacoaching.app

jobs:
  android:
    name: Android AAB
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Vérifier les secrets Android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          missing=0
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret GitHub manquant: $var"
              missing=1
            fi
          done
          if [ "${{ inputs.publish }}" = "true" ] && [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Secret GitHub manquant pour publier sur Google Play: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            missing=1
          fi
          exit "$missing"

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer version Android/iOS
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          IOS_BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          node scripts/set-store-version.mjs "${{ inputs.version }}" "$ANDROID_VERSION_CODE" "$IOS_BUILD_NUMBER"
          echo "ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Configurer la signature Android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ga-coaching"
          export KEYSTORE_PATH="$RUNNER_TEMP/ga-coaching-release.jks"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["KEYSTORE_PATH"]).write_bytes(
              base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"])
          )

          def esc(value: str) -> str:
              return value.replace("\\", "\\\\").replace("\n", "").replace("\r", "")

          props = "\n".join([
              f"storeFile={esc(os.environ['KEYSTORE_PATH'])}",
              f"storePassword={esc(os.environ['ANDROID_KEYSTORE_PASSWORD'])}",
              f"keyAlias={esc(os.environ['ANDROID_KEY_ALIAS'])}",
              f"keyPassword={esc(os.environ['ANDROID_KEY_PASSWORD'])}",
              "",
          ])
          Path.home().joinpath(".ga-coaching", "android-signing.properties").write_text(props)
          PY

      - name: Build web + sync Android
        run: npm run android:sync

      - name: Construire le bundle signé
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Conserver le AAB
        uses: actions/upload-artifact@v7
        with:
          name: ga-coaching-android-${{ inputs.version }}-run-${{ github.run_number }}
          path: v2/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publier sur Google Play
        if: ${{ inputs.publish }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gacoaching.app
          releaseFiles: v2/android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ inputs.android_track }}
          status: completed
          releaseName: v${{ inputs.version }}

  ios:
    name: iOS IPA
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-26

    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Vérifier les secrets Apple
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for var in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY_BASE64; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret GitHub manquant: $var"
              missing=1
            fi
          done
          exit "$missing"

      - name: Installer les dépendances
        run: npm ci

      - name: Build web + sync iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Préparer version iOS/Android
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          IOS_BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          node scripts/set-store-version.mjs "${{ inputs.version }}" "$ANDROID_VERSION_CODE" "$IOS_BUILD_NUMBER"
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Installer la clé API App Store Connect
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          export ASC_ALTOOL_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$ASC_ALTOOL_DIR"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          data = base64.b64decode(os.environ["APP_STORE_CONNECT_PRIVATE_KEY_BASE64"])
          key_path = Path(os.environ["ASC_KEY_PATH"])
          key_path.write_bytes(data)
          key_path.chmod(0o600)

          altool_path = Path(os.environ["ASC_ALTOOL_DIR"]) / f"AuthKey_{os.environ['APP_STORE_CONNECT_KEY_ID']}.p8"
          altool_path.write_bytes(data)
          altool_path.chmod(0o600)
          PY

          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Vérifier Xcode et le schéma
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings >/dev/null

      - name: Archiver l'app iOS
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild             -project ios/App/App.xcodeproj             -scheme App             -configuration Release             -destination "generic/platform=iOS"             -archivePath "$RUNNER_TEMP/GA-Coaching.xcarchive"             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"             -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGN_STYLE=Automatic             clean archive

      - name: Exporter l'IPA App Store
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          mkdir -p "$RUNNER_TEMP/ios-export"
          xcodebuild             -exportArchive             -archivePath "$RUNNER_TEMP/GA-Coaching.xcarchive"             -exportPath "$RUNNER_TEMP/ios-export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"             -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          IPA_PATH="$(find "$RUNNER_TEMP/ios-export" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Aucun IPA généré."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Conserver l'IPA
        uses: actions/upload-artifact@v7
        with:
          name: ga-coaching-ios-${{ inputs.version }}-run-${{ github.run_number }}
          path: ${{ runner.temp }}/ios-export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Envoyer vers App Store Connect / TestFlight
        if: ${{ inputs.publish }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool             --upload-app             --type ios             --file "$IPA_PATH"             --apiKey "$APP_STORE_CONNECT_KEY_ID"             --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
