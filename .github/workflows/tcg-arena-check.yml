name: GA TCG Arena checks

on:
  push:
    branches: [v2-refactor]
    paths:
      - 'v2/src/tcg-game.js'
      - 'v2/src/tcg-catalog.js'
      - 'v2/data/tcg-catalog-snapshot.json'
      - 'v2/tests/tcg-collection-dynamic.test.js'
      - 'v2/scripts/tcg-validate.mjs'
      - 'v2/scripts/tcg-simulate.mjs'
      - 'v2/src/tcg-pack-rules.js'
      - 'v2/src/tcg-art-quality.css'
      - 'v2/public/tcg/pack-icons.svg'
      - 'v2/tests/tcg-pack-loot-quality.test.js'
      - 'v2/src/tcg-arena.js'
      - 'v2/src/tcg-arena.css'
      - 'v2/src/tcg-spider-theme.css'
      - 'v2/src/tcg-pack-opening.css'
      - 'v2/src/tcg-interface-clean.css'
      - 'v2/tests/tcg-pack-opening.test.js'
      - 'v2/tests/tcg-interface-clean.test.js'
      - 'v2/src/tcg-alexandre-poison.css'
      - 'v2/public/tcg/alexandre-poison-crest.svg'
      - 'v2/public/tcg/spider-*.svg'
      - 'v2/tests/tcg-arena.test.js'
      - 'v2/tests/tcg-alexandre-art.test.js'
      - 'v2/tests/tcg-hugo-forge.test.js'
      - 'v2/tests/tcg-benoit-earth.test.js'
      - 'v2/tests/tcg-supplied-evolutions.test.js'
      - 'v2/src/tcg-supplied-evolutions.css'
      - 'v2/public/tcg/charles-casino-evolutions.webp'
      - 'v2/public/tcg/celia-foudre-evolutions.webp'
      - 'v2/public/tcg/camille-abysses-evolutions.webp'
      - 'v2/public/tcg/magicarpe-lego-evolutions.webp'
      - 'v2/public/tcg/clara-magicarpe-lvl5.webp'
      - 'v2/public/tcg/jolan-bonbons-evolutions.webp'
      - 'v2/tests/tcg-new-four-art.test.js'
      - 'v2/public/tcg/lou-evolutions.webp'
      - 'v2/public/tcg/flop-evolutions.webp'
      - 'v2/public/tcg/duane-evolutions.webp'
      - 'v2/public/tcg/serena-evolutions.webp'
      - 'v2/src/tcg-benoit-earth.css'
      - 'v2/public/tcg/benoit-terre-evolutions.webp'
      - 'v2/src/tcg-hugo-forge.css'
      - 'v2/public/tcg/hugo-forgeron-evolutions.webp'
      - 'v2/public/tcg/alexandre-evolutions.webp'
      - 'v2/package.json'
      - '.github/workflows/tcg-arena-check.yml'
  workflow_dispatch:

jobs:
  tcg-arena:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: Install dependencies
        working-directory: v2
        run: npm ci --ignore-scripts --no-audit
      - name: Test tactical arena
        working-directory: v2
        run: npm run test:tcg
      - name: Validate published catalog
        working-directory: v2
        run: npm run tcg:validate
      - name: Reproducible balance simulation
        working-directory: v2
        run: npm run tcg:simulate > /dev/null
      - name: Verify production build
        working-directory: v2
        run: npm run build
