name: GA Brute Check

# mybrute-ui-overhaul v2


on:
  push:
    branches:
      - v2-refactor
    paths:
      - ".github/workflows/brute-game-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: v2-refactor

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install
        run: npm ci

      - name: GA Brute tests
        run: npm run test:brute

      - name: Build
        run: npm run build
