name: Backend PR Filter CI

on:
  push:
    branches:
      - backend-pr-filter-ci-20261009

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - run: npm run build
