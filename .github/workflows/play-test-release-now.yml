name: Google Play 2.4 - Test fermé

on:
  push:
    branches:
      - v2-refactor
    paths:
      - ".github/workflows/play-test-release-now.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ga-coaching-android-alpha-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: "2.4"
  APP_ID: com.gacoaching.app

jobs:
  android:
    name: Android AAB
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Vérifier les secrets Android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          missing=0
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret GitHub manquant: $var"
              missing=1
            fi
          done
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Secret GitHub manquant pour publier sur Google Play: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            missing=1
          fi
          exit "$missing"

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les statistiques et les fonctionnalités
        run: |
          npm run test:stats
          npm run test:cloud
          npm run test:importer
          npm run test:rest
          npm run test:tcg

      - name: Préparer version Android/iOS
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_VERSION_CODE=$(( $(date -u +%s) / 60 ))
          IOS_BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          node scripts/set-store-version.mjs "${{ env.RELEASE_VERSION }}" "$ANDROID_VERSION_CODE" "$IOS_BUILD_NUMBER"
          echo "ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Configurer la signature Android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ga-coaching"
          export KEYSTORE_PATH="$RUNNER_TEMP/ga-coaching-release.jks"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["KEYSTORE_PATH"]).write_bytes(
              base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"])
          )

          def esc(value: str) -> str:
              return value.replace("\\", "\\\\").replace("\n", "").replace("\r", "")

          props = "\n".join([
              f"storeFile={esc(os.environ['KEYSTORE_PATH'])}",
              f"storePassword={esc(os.environ['ANDROID_KEYSTORE_PASSWORD'])}",
              f"keyAlias={esc(os.environ['ANDROID_KEY_ALIAS'])}",
              f"keyPassword={esc(os.environ['ANDROID_KEY_PASSWORD'])}",
              "",
          ])
          Path.home().joinpath(".ga-coaching", "android-signing.properties").write_text(props)
          PY

      - name: Build web + sync Android
        run: npm run android:sync

      - name: Construire le bundle signé
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Conserver le AAB
        uses: actions/upload-artifact@v7
        with:
          name: ga-coaching-android-${{ env.RELEASE_VERSION }}-run-${{ github.run_number }}
          path: v2/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publier sur Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gacoaching.app
          releaseFiles: v2/android/app/build/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: completed
          releaseName: v${{ env.RELEASE_VERSION }}

