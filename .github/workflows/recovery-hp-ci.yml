name: Recovery HP CI

on:
  push:
    branches:
      - recovery-hp-ci-20261008

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests
        run: |
          npm run test:cloud
          npm run test:importer
          npm run test:mobility
      - name: Build
        run: npm run build
