name: iOS 2.5 - Édition Noël

on:
  push:
    branches:
      - v2-refactor
    paths:
      - ".github/workflows/ios-christmas-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ga-coaching-ios-release
  cancel-in-progress: false

env:
  RELEASE_VERSION: "2.5"
  APP_DIR: v2
  APP_ID: com.gacoaching.app

jobs:
  ios:
    name: iOS IPA
    runs-on: macos-26

    defaults:
      run:
        working-directory: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Vérifier les secrets Apple
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for var in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret GitHub manquant: $var"
              missing=1
            fi
          done
          exit "$missing"

      - name: Installer les dépendances
        run: npm ci

      - name: Verify Advent calendar remains hidden before release
        run: |
          npm run test:advent
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const source = fs.readFileSync('src/main.js', 'utf8'); assert.match(source, /const ADVENT_CALENDAR_VISIBLE = false/); console.log('Calendrier masqué : OK')"

      - name: Build web + sync iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Préparer version iOS/Android
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          IOS_BUILD_NUMBER="$(date -u +%Y%m%d%H%M%S)"
          node scripts/set-store-version.mjs "${{ env.RELEASE_VERSION }}" "$ANDROID_VERSION_CODE" "$IOS_BUILD_NUMBER"
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Installer la clé API App Store Connect
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          export ASC_ALTOOL_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$ASC_ALTOOL_DIR"

          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          cp "$ASC_KEY_PATH" "$ASC_ALTOOL_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Vérifier Xcode et le schéma
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings >/dev/null

      - name: Archiver l'app iOS
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild             -project ios/App/App.xcodeproj             -scheme App             -configuration Release             -destination "generic/platform=iOS"             -archivePath "$RUNNER_TEMP/GA-Coaching.xcarchive"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             clean archive

      - name: Exporter l'IPA App Store
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          mkdir -p "$RUNNER_TEMP/ios-export"
          xcodebuild             -exportArchive             -archivePath "$RUNNER_TEMP/GA-Coaching.xcarchive"             -exportPath "$RUNNER_TEMP/ios-export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$ASC_KEY_PATH"             -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID"             -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          IPA_PATH="$(find "$RUNNER_TEMP/ios-export" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Aucun IPA généré."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Conserver l'IPA
        uses: actions/upload-artifact@v7
        with:
          name: ga-coaching-ios-${{ env.RELEASE_VERSION }}-run-${{ github.run_number }}
          path: ${{ runner.temp }}/ios-export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Envoyer vers App Store Connect / TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool             --upload-app             --type ios             --file "$IPA_PATH"             --apiKey "$APP_STORE_CONNECT_KEY_ID"             --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
