<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="/theme-ls-native.css?v=16" />
    <title>L'araignée Coaching</title>

    <style id="ga-ls-v16-critical">
      /*
       * V16 — couche critique Louis / Sarah.
       * On neutralise les anciens pseudo-elements et toutes les anciennes
       * regles qui pouvaient masquer les enfants de la bannière.
       * La spécificité est volontairement très forte.
       */
      html body .training-page[data-athlete-theme="louis"] .athlete-theme-banner::before,
      html body .training-page[data-athlete-theme="louis"] .athlete-theme-banner::after,
      html body .training-page[data-athlete-theme="sarah"] .athlete-theme-banner::before,
      html body .training-page[data-athlete-theme="sarah"] .athlete-theme-banner::after {
        content: none !important;
        display: none !important;
        background: none !important;
        opacity: 0 !important;
      }

      html body .training-page[data-athlete-theme="louis"] .athlete-theme-banner > .ga-ls-hero-image,
      html body .training-page[data-athlete-theme="sarah"] .athlete-theme-banner > .ga-ls-hero-image {
        display: block !important;
        position: absolute !important;
        z-index: 1000 !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        object-fit: cover !important;
        object-position: center center !important;
        opacity: 1 !important;
        visibility: visible !important;
        mix-blend-mode: normal !important;
        pointer-events: none !important;
        border: 0 !important;
        border-radius: inherit !important;
      }

      html body .training-page[data-athlete-theme="louis"] .athlete-theme-banner > .ga-ls-overlay,
      html body .training-page[data-athlete-theme="sarah"] .athlete-theme-banner > .ga-ls-overlay {
        display: block !important;
        position: absolute !important;
        z-index: 1001 !important;
        inset: 0 !important;
        pointer-events: none !important;
        border-radius: inherit !important;
      }

      html body .training-page[data-athlete-theme="louis"] .athlete-theme-banner > .ga-ls-light,
      html body .training-page[data-athlete-theme="sarah"] .athlete-theme-banner > .ga-ls-light {
        display: block !important;
        position: absolute !important;
        z-index: 1002 !important;
        pointer-events: none !important;
      }

      html body .training-page[data-athlete-theme="louis"] .athlete-theme-banner > .ga-ls-name,
      html body .training-page[data-athlete-theme="sarah"] .athlete-theme-banner > .ga-ls-name {
        display: block !important;
        position: absolute !important;
        z-index: 1003 !important;
        opacity: 1 !important;
        visibility: visible !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

    <script>
      (() => {
        /*
         * HERO LOADER V16 — Louis + Sarah
         *
         * V15 a prouvé dans la console que Louis est bien téléchargé et
         * décodé en 1800x720. Le problème restant est donc le rendu / stacking,
         * pas le chemin du fichier.
         *
         * V16 force le rendu à deux niveaux :
         * 1) vraie balise <img> au-dessus de toutes les anciennes couches ;
         * 2) la même source est aussi appliquée comme background inline
         *    !important de la bannière. Même si une vieille règle cache l'img,
         *    l'art reste visible.
         */

        const HEROES = {
          louis: {
            name: 'LOUIS',
            asset: 'themes/louis/louis-fusion.webp?v=16',
            alt: 'Univers personnalisé de Louis',
            filter: 'brightness(1.34) saturate(1.16) contrast(1.06)',
          },
          sarah: {
            name: 'SARAH',
            asset: 'themes/sarah/sarah-fusion.jpg?v=16',
            alt: 'Univers personnalisé de Sarah',
            filter: 'brightness(1.28) saturate(1.12) contrast(1.05)',
          },
        };

        const objectUrls = new WeakMap();

        function forceStyle(node, property, value) {
          node.style.setProperty(property, value, 'important');
        }

        function unique(values) {
          return [...new Set(values.filter(Boolean))];
        }

        function assetCandidates(asset) {
          const clean = String(asset || '').replace(/^\/+/, '');
          const candidates = [];

          const themeLink = [...document.querySelectorAll('link[rel="stylesheet"]')]
            .find((link) => String(link.href || '').includes('theme-ls-native.css'));

          if (themeLink?.href) {
            try {
              candidates.push(new URL(clean, themeLink.href).href);
            } catch {}
          }

          try {
            candidates.push(new URL(`/${clean}`, window.location.origin).href);
          } catch {}

          try {
            candidates.push(new URL(clean, document.baseURI).href);
          } catch {}

          try {
            const firstPathPart = window.location.pathname
              .split('/')
              .filter(Boolean)[0];

            if (firstPathPart) {
              candidates.push(
                new URL(`/${firstPathPart}/${clean}`, window.location.origin).href
              );
            }
          } catch {}

          return unique(candidates);
        }

        function asciiHead(bytes, length = 16) {
          return String.fromCharCode(...bytes.slice(0, length));
        }

        function bytesAreJpeg(bytes) {
          return bytes.length >= 3 && bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff;
        }

        function bytesArePng(bytes) {
          return (
            bytes.length >= 8 &&
            bytes[0] === 0x89 &&
            bytes[1] === 0x50 &&
            bytes[2] === 0x4e &&
            bytes[3] === 0x47
          );
        }

        function bytesAreWebp(bytes) {
          if (bytes.length < 12) return false;
          const head = asciiHead(bytes, 12);
          return head.slice(0, 4) === 'RIFF' && head.slice(8, 12) === 'WEBP';
        }

        async function fetchRenderableSource(url) {
          const response = await fetch(url, { cache: 'no-store' });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const buffer = await response.arrayBuffer();
          const bytes = new Uint8Array(buffer);

          if (!bytes.length) {
            throw new Error('fichier vide');
          }

          if (bytesAreWebp(bytes)) {
            return {
              src: URL.createObjectURL(new Blob([buffer], { type: 'image/webp' })),
              objectUrl: true,
              format: 'webp-binary',
            };
          }

          if (bytesAreJpeg(bytes)) {
            return {
              src: URL.createObjectURL(new Blob([buffer], { type: 'image/jpeg' })),
              objectUrl: true,
              format: 'jpeg-binary',
            };
          }

          if (bytesArePng(bytes)) {
            return {
              src: URL.createObjectURL(new Blob([buffer], { type: 'image/png' })),
              objectUrl: true,
              format: 'png-binary',
            };
          }

          const text = new TextDecoder()
            .decode(buffer)
            .replace(/\s+/g, '')
            .trim();

          if (text.startsWith('/9j/')) {
            return {
              src: `data:image/jpeg;base64,${text}`,
              objectUrl: false,
              format: 'jpeg-base64-text',
            };
          }

          if (text.startsWith('UklGR')) {
            return {
              src: `data:image/webp;base64,${text}`,
              objectUrl: false,
              format: 'webp-base64-text',
            };
          }

          if (text.startsWith('iVBOR')) {
            return {
              src: `data:image/png;base64,${text}`,
              objectUrl: false,
              format: 'png-base64-text',
            };
          }

          throw new Error('format image inconnu');
        }

        function decodeIntoImage(image, source) {
          return new Promise((resolve, reject) => {
            const cleanup = () => {
              image.removeEventListener('load', onLoad);
              image.removeEventListener('error', onError);
            };

            const onLoad = () => {
              cleanup();
              if (!image.naturalWidth || !image.naturalHeight) {
                reject(new Error('image sans dimensions'));
                return;
              }
              resolve();
            };

            const onError = () => {
              cleanup();
              reject(new Error('decodeur navigateur: erreur image'));
            };

            image.addEventListener('load', onLoad);
            image.addEventListener('error', onError);
            image.src = source.src;
          });
        }

        function forceBannerGeometry(banner) {
          forceStyle(banner, 'position', 'relative');
          forceStyle(banner, 'isolation', 'isolate');
          forceStyle(banner, 'overflow', 'hidden');
          forceStyle(banner, 'padding', '0');
        }

        function forceImageGeometry(image, config) {
          forceStyle(image, 'display', 'block');
          forceStyle(image, 'position', 'absolute');
          forceStyle(image, 'z-index', '1000');
          forceStyle(image, 'inset', '0');
          forceStyle(image, 'width', '100%');
          forceStyle(image, 'height', '100%');
          forceStyle(image, 'max-width', 'none');
          forceStyle(image, 'max-height', 'none');
          forceStyle(image, 'object-fit', 'cover');
          forceStyle(image, 'object-position', 'center center');
          forceStyle(image, 'opacity', '1');
          forceStyle(image, 'visibility', 'visible');
          forceStyle(image, 'mix-blend-mode', 'normal');
          forceStyle(image, 'filter', config.filter);
          forceStyle(image, 'pointer-events', 'none');
          forceStyle(image, 'border-radius', 'inherit');
        }

        function installVisualLayers(banner, config) {
          const overlay = document.createElement('div');
          overlay.className = 'ga-ls-overlay';
          overlay.setAttribute('aria-hidden', 'true');

          const light = document.createElement('div');
          light.className = 'ga-ls-light';
          light.setAttribute('aria-hidden', 'true');

          const name = document.createElement('h2');
          name.className = 'ga-ls-name';
          name.textContent = config.name;

          banner.append(overlay, light, name);
        }

        function imageStats(image) {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = 48;
            canvas.height = 20;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
            const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            let sum = 0;
            let count = 0;
            let min = 255;
            let max = 0;

            for (let i = 0; i < pixels.length; i += 4) {
              const luminance = 0.2126 * pixels[i] + 0.7152 * pixels[i + 1] + 0.0722 * pixels[i + 2];
              sum += luminance;
              min = Math.min(min, luminance);
              max = Math.max(max, luminance);
              count += 1;
            }

            return {
              average: Math.round(sum / Math.max(1, count)),
              min: Math.round(min),
              max: Math.round(max),
            };
          } catch {
            return null;
          }
        }

        async function loadHeroImage(image, banner, page, slug, config) {
          const failures = [];

          for (const candidate of assetCandidates(config.asset)) {
            let source = null;

            try {
              source = await fetchRenderableSource(candidate);
              await decodeIntoImage(image, source);

              const previousObjectUrl = objectUrls.get(image);
              if (previousObjectUrl && previousObjectUrl !== source.src) {
                URL.revokeObjectURL(previousObjectUrl);
              }

              if (source.objectUrl) {
                objectUrls.set(image, source.src);
              } else {
                objectUrls.delete(image);
              }

              /*
               * DOUBLE RENDU : la même image est aussi posée comme background
               * inline !important. Cela contourne définitivement un éventuel
               * display:none/z-index hérité d'un ancien thème.
               */
              forceStyle(banner, 'background-image', `url("${source.src}")`);
              forceStyle(banner, 'background-size', 'cover');
              forceStyle(banner, 'background-position', 'center center');
              forceStyle(banner, 'background-repeat', 'no-repeat');

              forceImageGeometry(image, config);

              page.dataset.gaHeroLoaded = slug;
              page.dataset.gaHeroFormat = source.format;
              page.removeAttribute('data-ga-hero-error');

              const computed = getComputedStyle(image);
              const rect = image.getBoundingClientRect();
              const stats = imageStats(image);

              console.info(
                `[GA HERO V16] ${slug} OK`,
                `${image.naturalWidth}x${image.naturalHeight}`,
                source.format,
                `display=${computed.display}`,
                `opacity=${computed.opacity}`,
                `z=${computed.zIndex}`,
                `box=${Math.round(rect.width)}x${Math.round(rect.height)}`,
                stats ? `lum=${stats.average} (${stats.min}-${stats.max})` : 'lum=n/a',
                candidate
              );

              return true;
            } catch (error) {
              if (source?.objectUrl && source.src) {
                URL.revokeObjectURL(source.src);
              }

              failures.push(`${candidate} -> ${error?.message || error}`);
            }
          }

          page.dataset.gaHeroError = slug;
          console.error(`[GA HERO V16] ${slug} ECHEC`, failures);
          return false;
        }

        async function mountHero(page, slug, config) {
          const banner = page.querySelector('.athlete-theme-banner');
          if (!banner) return;

          if (banner.dataset.gaNativeHero === slug) {
            const existingImage = banner.querySelector('.ga-ls-hero-image');
            if (existingImage) {
              forceBannerGeometry(banner);
              forceImageGeometry(existingImage, config);
            }
            return;
          }

          if (banner.dataset.gaHeroMounting === slug) return;
          banner.dataset.gaHeroMounting = slug;

          forceBannerGeometry(banner);
          banner.classList.add('athlete-theme-banner--ga-native');
          banner.innerHTML = '';

          const image = document.createElement('img');
          image.className = 'ga-ls-hero-image';
          image.alt = config.alt;
          image.decoding = 'async';
          image.loading = 'eager';
          image.draggable = false;

          forceImageGeometry(image, config);
          banner.append(image);
          installVisualLayers(banner, config);

          const success = await loadHeroImage(image, banner, page, slug, config);

          if (success) {
            banner.dataset.gaNativeHero = slug;
          }

          banner.removeAttribute('data-ga-hero-mounting');
        }

        function mountAll() {
          Object.entries(HEROES).forEach(([slug, config]) => {
            document
              .querySelectorAll(`.training-page[data-athlete-theme="${slug}"]`)
              .forEach((page) => {
                void mountHero(page, slug, config);
              });
          });
        }

        let scheduled = false;
        function scheduleMount() {
          if (scheduled) return;
          scheduled = true;

          requestAnimationFrame(() => {
            scheduled = false;
            mountAll();
          });
        }

        const observer = new MutationObserver(scheduleMount);
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
        });

        window.addEventListener('DOMContentLoaded', scheduleMount);
        window.addEventListener('hashchange', scheduleMount);
        window.addEventListener('popstate', scheduleMount);
        scheduleMount();
      })();
    </script>
  </body>
</html>
